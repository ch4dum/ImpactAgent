[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impactagent"
version = "0.1.0"
description = "CS2 demo analytics with an LLM coach"
requires-python = ">=3.10"
dependencies = [
    "demoparser2>=0.30",
    "pandas>=2.2",
    "pyarrow>=14",
    "pyyaml>=6",
    "zstandard>=0.22",
]

[project.optional-dependencies]
# Raycast visibility backend (impactagent/visibility). awpy 3.1 needs polars>=2 (demoparser2 0.42 works with it).
visibility = ["awpy>=3.1.1"]
# WP-model training (impactagent/ratings). scikit-learn is used only to FIT the model; the
# saved model is plain JSON and predict_wp runs on numpy alone (no sklearn at inference).
train = ["scikit-learn>=1.3"]

[tool.setuptools.packages.find]
# impactagent/ (library) at the root, iaserver (pipeline / api / worker) under server/.
where = [".", "server"]
include = ["impactagent*", "iaserver*"]

[tool.setuptools.package-data]
impactagent = ["metrics/*.yaml", "validate/*.yaml"]
